name: Release

# Thin caller of glyph's reusable rolling-DRAFT release. A push to main makes
# `glyph release` compute the next version and the notes from each merged
# PR's individual (pre-squash) commits — gitmoji-driven and squash-safe — and
# create/update a single DRAFT release (no tag until you Publish in the UI).
# The verdict + draft logic and the binary that runs it ship together from
# akira-toriyama/glyph at ONE concrete tag (never a moving ref); this file
# supplies only chord's name + install prose. chord was the git-cliff canary
# and is the first repo flipped to glyph (t-jhmn Phase 6, ratified Q16 —
# direct flip, no shadow run). The git-cliff era config (cliff.toml) is gone;
# the classification table lives inside the glyph binary (`glyph rules`).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (no draft; just artifacts)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Job-level, not workflow-level: zizmor reads a workflow-wide
    # `contents: write` as overly broad once version-sync (read-only) exists.
    permissions:
      contents: write
    uses: akira-toriyama/glyph/.github/workflows/release.yml@v4.0.0
    with:
      app: Chord
      # chord is yabai-style: `chord config --validate` is the post-build smoke.
      smoke-cmd: config --validate
      dry-run: ${{ github.event.inputs.dry_run == 'true' }}
      install-notes: |
        ## Install

        **Homebrew:**

        ```sh
        brew install akira-toriyama/tap/chord

        # One-time setup so the Accessibility grant persists across upgrades
        $(brew --prefix)/share/chord/setup-signing-cert.sh   # create chord-dev identity
        chord daemon --resign                                 # re-sign + restart

        brew services start chord
        ```

        After every `brew upgrade chord`, run `chord daemon --resign` once —
        Homebrew's build sandbox can't touch your login keychain during
        install, so the bundle is ad-hoc signed and the Accessibility grant
        would otherwise be lost on each upgrade. `chord daemon --resign` swaps
        the ad-hoc signature for the persistent `chord-dev` identity and
        restarts the daemon in one step.

        **Prebuilt (`Chord.zip` below):** ad-hoc signed (not notarized), so
        macOS quarantines it on download. After unzipping:

        ```sh
        xattr -dr com.apple.quarantine Chord.app
        open Chord.app
        ```

        Then grant **Accessibility** to *chord* (System Settings → Privacy &
        Security → Accessibility) and relaunch.

        **Config:** chord reads `~/.config/chord/config.toml`:

        ```sh
        curl --create-dirs -o ~/.config/chord/config.toml \
          https://raw.githubusercontent.com/akira-toriyama/chord/main/config.toml
        ```

  # The tag glyph cuts lands on a commit that ALREADY EXISTS, so nothing in
  # the release flow rewrites `ChordVersion.current`; the PR that moves the
  # verdict bumps it by hand, with Info.plist. scripts/check-version-sync.sh
  # holds those two together and nothing else — both standing still is
  # invisible to it, and that happened: the constant said 0.10.0 through
  # v0.11.0, v1.0.0 and v2.0.0 (measured against the tags, 2026-08-13). This
  # job compares the constant with the tag the rolling draft targets, so a
  # forgotten bump is a red Release run on main instead of a `chord
  # --version` that under-reports the release it came from. Same shape as
  # glance's version-sync. Skipped when no release is due (`next` is empty
  # on a none verdict).
  version-sync:
    needs: release
    if: needs.release.outputs.next != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare ChordVersion.current with the rolling draft's tag
        env:
          NEXT: ${{ needs.release.outputs.next }}
        run: |
          set -euo pipefail
          current="$(sed -n 's/^ *public static let current = "\(.*\)"$/\1/p' Sources/ChordCore/Version.swift)"
          if [ -z "$current" ]; then
            echo "::error::Sources/ChordCore/Version.swift no longer declares 'public static let current = \"…\"' on one line — this job reads exactly that."
            exit 1
          fi
          if [ "v$current" != "$NEXT" ]; then
            echo "::error::ChordVersion.current is $current but the rolling draft targets $NEXT — set it to ${NEXT#v} in Sources/ChordCore/Version.swift and Info.plist (scripts/check-version-sync.sh keeps those two together) before publishing; a ':bookmark:(version)= …' commit keeps the verdict where it is."
            exit 1
          fi
          echo "ChordVersion.current $current matches the draft's $NEXT"
